[project]
name = "cyberterrarium"
version = "0.1.0"
description = "CyberTerrarium - 自进化数字生命模拟系统，基于图灵机理论与人工化学周期表"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5",
    "pygame-gui>=0.6",
    "numpy>=1.26",
    "numba>=0.60",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cyberterrarium"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pygame_ce.*", "numba.*", "pygame_gui.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberterrarium"]
